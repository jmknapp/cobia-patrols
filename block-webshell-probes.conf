# Block webshell probe attacks with fake search engine referrers
# Pattern: .php requests with Google/Bing/Yahoo referrers are almost always attacks
# Real search traffic goes to real pages, not random PHP files

<IfModule mod_rewrite.c>
    RewriteEngine On
    
    # Block .php requests with search engine referrers
    RewriteCond %{REQUEST_URI} \.php$ [NC]
    RewriteCond %{HTTP_REFERER} (google\.|bing\.|yahoo\.|duckduckgo\.) [NC]
    RewriteRule .* - [F,L]
    
    # Also block common webshell probe paths regardless of referrer
    RewriteCond %{REQUEST_URI} ^/(wp-|wordpress|admin\.php|shell|upload\.php|config\.php|\.env) [NC]
    RewriteRule .* - [F,L]
</IfModule>


